name: Unzip site update
on:
  push:
    paths:
      - 'site-update.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site files from site-update.zip
        run: |
          if [ ! -f site-update.zip ]; then echo "Hakuna site-update.zip, ruka."; exit 0; fi
          mkdir /tmp/new
          unzip -q site-update.zip -d /tmp/new
          SRC=/tmp/new
          if [ ! -f /tmp/new/index.html ] && [ "$(ls -A /tmp/new | wc -l)" -eq 1 ]; then SRC="/tmp/new/$(ls -A /tmp/new)"; fi
          test -f "$SRC/index.html"
          test -f "$SRC/functions/orodha/index.js"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Site update v69 (functions: orodha, api/indexnow, catalog)"
          git push
